version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: protest_postgres
    restart: always
    environment:
      POSTGRES_USER: protest_user
      POSTGRES_PASSWORD: protest_pass_2026
      POSTGRES_DB: protest_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U protest_user -d protest_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: protest_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: protest_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://protest_user:protest_pass_2026@postgres:5432/protest_db?schema=public
      JWT_SECRET: protest-super-secret-jwt-key-2026-math
      NODE_ENV: production
    ports:
      - '4000:4000'
    volumes:
      - ../uploads:/app/uploads

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: protest_web
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: protest_nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
  redis_data:
